<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0d12; --pink:#ff3b3b; --cyan:#5eead4; --yellow:#ffd166; --purple:#b98dff;
    --text:#f5f6f8; --text-dim:#9aa1ad; --line:#1d222b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--ink); color:var(--text);
    font-family:'Work Sans',sans-serif; padding:20px 16px 60px;
  }
  .wrap{max-width:640px; margin:0 auto;}
  .back{
    display:inline-flex; align-items:center; gap:6px; color:var(--text-dim);
    text-decoration:none; font-size:14px; margin-bottom:18px;
  }
  h1{
    font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:26px;
    margin:0 0 6px;
  }
  .sub{color:var(--text-dim); font-size:14px; margin:0 0 26px; line-height:1.5;}
  .card{
    background:#10141b; border:1px solid var(--line); border-radius:16px;
    padding:20px; margin-bottom:16px;
  }
  label{display:block; font-size:13px; color:var(--text-dim); margin-bottom:6px; font-weight:500;}
  input[type=text]{
    width:100%; background:#0a0d12; border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:12px 14px; font-size:14px; font-family:'Work Sans',sans-serif;
    margin-bottom:16px;
  }
  input:focus{outline:none; border-color:var(--cyan);}
  button{
    width:100%; border:none; border-radius:12px; padding:14px; font-size:15px;
    font-weight:600; font-family:'Work Sans',sans-serif; cursor:pointer;
  }
  .btn-primary{background:var(--pink); color:#fff;}
  .btn-primary:disabled{opacity:.5;}
  .status{
    font-size:13px; color:var(--text-dim); text-align:center; margin-top:12px; min-height:18px;
  }
  .status.err{color:var(--pink);}
  .result{
    display:none; background:linear-gradient(160deg,#0e1a17,#10141b);
    border:1px solid var(--cyan); border-radius:16px; padding:22px; margin-top:6px;
    animation:pop .3s ease;
  }
  .result.show{display:block;}
  @keyframes pop{from{transform:scale(.92); opacity:0;} to{transform:scale(1); opacity:1;}}
  .result-tag{
    font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:12px;
    letter-spacing:.08em; text-transform:uppercase; color:var(--cyan); margin-bottom:10px;
  }
  .final-url{
    font-family:'Space Mono',monospace; font-size:13px; word-break:break-all;
    line-height:1.6; margin-bottom:14px; color:var(--text);
  }
  .copy-btn{
    background:var(--ink-3,#1a1f29); color:var(--text); border:1px solid var(--line) !important;
    padding:10px; font-size:13px; margin-top:0;
  }
  .hop-count{font-size:12px; color:var(--text-dim); margin-top:14px; font-family:'Space Mono',monospace;}
  .hop-list{margin-top:8px; font-size:11.5px; color:var(--text-dim); font-family:'Space Mono',monospace; line-height:1.8; word-break:break-all;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; Back</a>
  <h1>Link Checker</h1>
  <p class="sub">Paste any short or redirect link and see exactly where it actually leads &mdash; before you tap it.</p>

  <div class="card">
    <label for="linkInput">Link to check</label>
    <input type="text" id="linkInput" placeholder="https://...">
    <button class="btn-primary" id="checkBtn">Check Link</button>
    <div class="status" id="checkStatus"></div>
  </div>

  <div class="result" id="resultCard">
    <div class="result-tag">Final destination</div>
    <div class="final-url" id="finalUrl"></div>
    <button class="copy-btn" id="copyBtn">Copy Link</button>
    <div class="hop-count" id="hopCount"></div>
    <div class="hop-list" id="hopList"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const PROXY_URL = 'https://crimson-resonance-b977ayush-cricket-proxy.ayushjibabuaan07.workers.dev/';

$('checkBtn').addEventListener('click', async () => {
  const link = $('linkInput').value.trim();
  const statusEl = $('checkStatus');
  const resultCard = $('resultCard');

  resultCard.classList.remove('show');

  if (!link || !/^https?:\/\//i.test(link)) {
    statusEl.textContent = 'Paste a full link starting with http:// or https://';
    statusEl.className = 'status err';
    return;
  }

  $('checkBtn').disabled = true;
  statusEl.textContent = 'Checking...';
  statusEl.className = 'status';

  try {
    const url = PROXY_URL + '?action=linkcheck&url=' + encodeURIComponent(link);
    const resp = await fetch(url);
    const data = await resp.json();

    if (data.error) {
      statusEl.textContent = 'Error: ' + data.error;
      statusEl.className = 'status err';
      return;
    }

    statusEl.textContent = '';
    $('finalUrl').textContent = data.finalUrl;
    $('hopCount').textContent = data.hopCount > 1
      ? `Went through ${data.hopCount} redirect${data.hopCount > 2 ? 's' : ''}`
      : 'No redirects — this is a direct link';

    if (data.hops && data.hops.length > 1) {
      $('hopList').innerHTML = data.hops.map((h, i) => `${i + 1}. [${h.status}] ${h.url}`).join('<br>');
    } else {
      $('hopList').innerHTML = '';
    }

    resultCard.classList.remove('show');
    void resultCard.offsetWidth;
    resultCard.classList.add('show');
    resultCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
  } catch (err) {
    statusEl.textContent = 'Something went wrong. Try again.';
    statusEl.className = 'status err';
  } finally {
    $('checkBtn').disabled = false;
  }
});

$('copyBtn').addEventListener('click', () => {
  const text = $('finalUrl').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = $('copyBtn');
    const original = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
});
</script>
</body>
</html>
