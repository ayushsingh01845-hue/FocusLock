<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Live Cricket Score</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0d12;--ink-3:#1a1f29;--pink:#ff3b3b;--cyan:#5eead4;--yellow:#ffd166;--purple:#b98dff;--text:#f5f6f8;--text-dim:#9aa1ad;--line:#1d222b;}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;background:var(--ink);color:var(--text);font-family:"Work Sans",sans-serif;padding:20px 16px 60px;}
.wrap{max-width:560px;margin:0 auto;}
.back{display:inline-flex;color:var(--text-dim);text-decoration:none;font-size:14px;margin-bottom:18px;}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;margin:0 0 6px;}
.sub{color:var(--text-dim);font-size:14px;margin:0 0 22px;line-height:1.5;}
.card{background:#10141b;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;}
button{border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:600;font-family:"Work Sans",sans-serif;cursor:pointer;}
.cr-name{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;margin-bottom:8px;}
.cr-status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:"Space Mono",monospace;padding:4px 9px;border-radius:8px;background:var(--ink-3);color:var(--text-dim);margin-bottom:8px;}
.cr-status.live{color:var(--cyan);}
.cr-dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:p 1.8s ease-in-out infinite;}
@keyframes p{0%,100%{opacity:1}50%{opacity:.35}}
.cr-score{font-size:13.5px;line-height:1.7;}
.empty{color:var(--text-dim);font-size:13px;text-align:center;padding:20px;}
</style></head><body><div class="wrap">
<a class="back" href="index.html">&larr; Back</a>
<h1>Live Cricket Score</h1>
<p class="sub">Auto-refreshes every 45 seconds.</p>
<div id="list"><div class="empty">Loading...</div></div>
</div>
<script>
const PROXY_BASE_URL='https://crimson-resonance-b977ayush-cricket-proxy.ayushjibabuaan07.workers.dev/';
const list=document.getElementById('list');
async function load(){
  try{
    const res=await fetch(PROXY_BASE_URL+'?action=cricket&_='+Date.now());
    const json=await res.json();
    const matches=(json&&json.data)?json.data.slice(0,8):[];
    if(!matches.length){list.innerHTML='<div class="card"><div class="empty">No live matches right now.</div></div>';return;}
    list.innerHTML='';
    matches.forEach(m=>{
      const card=document.createElement('div');card.className='card';
      const st=(m.status||'').trim();
      const live=/live|innings|need/i.test(st)&&!/won|finished|abandoned|no result/i.test(st);
      const n=document.createElement('div');n.className='cr-name';n.textContent=m.name||'Match';card.appendChild(n);
      const s=document.createElement('span');s.className='cr-status'+(live?' live':'');
      if(live){s.innerHTML='<span class="cr-dot"></span>LIVE';}else{s.textContent=st||'Scheduled';}
      card.appendChild(s);
      if(Array.isArray(m.score)&&m.score.length){
        const sc=document.createElement('div');sc.className='cr-score';
        sc.innerHTML=m.score.map(x=>(x.inning||'')+': '+x.r+'/'+x.w+((x.o!==undefined)?' ('+x.o+' ov)':'')).join('<br>');
        card.appendChild(sc);
      }
      list.appendChild(card);
    });
  }catch(e){list.innerHTML='<div class="card"><div class="empty">Could not load scores. Check your connection.</div></div>';}
}
load();setInterval(load,45000);
</script></body></html>
