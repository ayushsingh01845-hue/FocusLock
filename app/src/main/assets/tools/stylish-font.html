<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stylish Font Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0d12; --ink-3:#1a1f29; --pink:#ff3b3b; --cyan:#5eead4; --yellow:#ffd166; --purple:#b98dff;
    --text:#f5f6f8; --text-dim:#9aa1ad; --line:#1d222b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--ink); color:var(--text);
    font-family:'Work Sans',sans-serif; padding:20px 16px 60px;
  }
  .wrap{max-width:560px; margin:0 auto;}
  .back{
    display:inline-flex; align-items:center; gap:6px; color:var(--text-dim);
    text-decoration:none; font-size:14px; margin-bottom:18px;
  }
  h1{
    font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:26px;
    margin:0 0 6px;
  }
  .sub{color:var(--text-dim); font-size:14px; margin:0 0 22px; line-height:1.5;}
  .card{
    background:#10141b; border:1px solid var(--line); border-radius:16px;
    padding:20px; margin-bottom:16px;
  }
  label{display:block; font-size:13px; color:var(--text-dim); margin-bottom:6px; font-weight:500;}
  input[type=text]{
    width:100%; background:#0a0d12; border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:12px 14px; font-size:15px; font-family:'Work Sans',sans-serif;
  }
  input:focus{outline:none; border-color:var(--cyan);}
  .results{margin-top:6px;}
  .style-row{
    background:var(--ink-3); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .style-label{font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:5px; font-family:'Space Mono',monospace;}
  .style-text{font-size:16px; word-break:break-word; line-height:1.5;}
  .copy-btn{
    flex-shrink:0; background:none; border:1px solid var(--line); color:var(--cyan);
    border-radius:8px; padding:8px 12px; font-size:12px; cursor:pointer; width:auto;
    font-family:'Work Sans',sans-serif;
  }
  .empty-state{color:var(--text-dim); font-size:13px; text-align:center; padding:30px 10px;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; Back</a>
  <h1>Stylish Font Generator</h1>
  <p class="sub">Type anything and get instant fancy fonts for your bio, captions, or DP name.</p>

  <div class="card">
    <label for="textInput">Your text</label>
    <input type="text" id="textInput" placeholder="Type here..." value="Ayush">
  </div>

  <div class="results" id="results"></div>
</div>

<script>
const $ = id => document.getElementById(id);

const LOWER = "abcdefghijklmnopqrstuvwxyz";
const UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const DIGITS = "0123456789";

const STYLES = [
  { name: "Bold", lower: "𝐚𝐛𝐜𝐝𝐞𝐟𝐠𝐡𝐢𝐣𝐤𝐥𝐦𝐧𝐨𝐩𝐪𝐫𝐬𝐭𝐮𝐯𝐰𝐱𝐲𝐳", upper: "𝐀𝐁𝐂𝐃𝐄𝐅𝐆𝐇𝐈𝐉𝐊𝐋𝐌𝐍𝐎𝐏𝐐𝐑𝐒𝐓𝐔𝐕𝐖𝐗𝐘𝐙", digits: "𝟎𝟏𝟐𝟑𝟒𝟓𝟔𝟕𝟖𝟗" },
  { name: "Italic", lower: "𝑎𝑏𝑐𝑑𝑒𝑓𝑔ℎ𝑖𝑗𝑘𝑙𝑚𝑛𝑜𝑝𝑞𝑟𝑠𝑡𝑢𝑣𝑤𝑥𝑦𝑧", upper: "𝐴𝐵𝐶𝐷𝐸𝐹𝐺𝐻𝐼𝐽𝐾𝐿𝑀𝑁𝑂𝑃𝑄𝑅𝑆𝑇𝑈𝑉𝑊𝑋𝑌𝑍", digits: "" },
  { name: "Bold Italic", lower: "𝒂𝒃𝒄𝒅𝒆𝒇𝒈𝒉𝒊𝒋𝒌𝒍𝒎𝒏𝒐𝒑𝒒𝒓𝒔𝒕𝒖𝒗𝒘𝒙𝒚𝒛", upper: "𝑨𝑩𝑪𝑫𝑬𝑭𝑮𝑯𝑰𝑱𝑲𝑳𝑴𝑵𝑶𝑷𝑸𝑹𝑺𝑻𝑼𝑽𝑾𝑿𝒀𝒁", digits: "" },
  { name: "Script", lower: "𝒶𝒷𝒸𝒹ℯ𝒻ℊ𝒽𝒾𝒿𝓀𝓁𝓂𝓃ℴ𝓅𝓆𝓇𝓈𝓉𝓊𝓋𝓌𝓍𝓎𝓏", upper: "𝒜ℬ𝒞𝒟ℰℱ𝒢ℋℐ𝒥𝒦ℒℳ𝒩𝒪𝒫𝒬ℛ𝒮𝒯𝒰𝒱𝒲𝒳𝒴𝒵", digits: "" },
  { name: "Double-struck", lower: "𝕒𝕓𝕔𝕕𝕖𝕗𝕘𝕙𝕚𝕛𝕜𝕝𝕞𝕟𝕠𝕡𝕢𝕣𝕤𝕥𝕦𝕧𝕨𝕩𝕪𝕫", upper: "𝔸𝔹ℂ𝔻𝔼𝔽𝔾ℍ𝕀𝕁𝕂𝕃𝕄ℕ𝕆ℙℚℝ𝕊𝕋𝕌𝕍𝕎𝕏𝕐ℤ", digits: "𝟘𝟙𝟚𝟛𝟜𝟝𝟞𝟟𝟠𝟡" },
  { name: "Gothic", lower: "𝔞𝔟𝔠𝔡𝔢𝔣𝔤𝔥𝔦𝔧𝔨𝔩𝔪𝔫𝔬𝔭𝔮𝔯𝔰𝔱𝔲𝔳𝔴𝔵𝔶𝔷", upper: "𝔄𝔅ℭ𝔇𝔈𝔉𝔊ℌℑ𝔍𝔎𝔏𝔐𝔑𝔒𝔓𝔔ℜ𝔖𝔗𝔘𝔙𝔚𝔛𝔜ℨ", digits: "" },
  { name: "Full Width", lower: "ａｂｃｄｅｆｇｈｉｊｋｌｍｎｏｐｑｒｓｔｕｖｗｘｙｚ", upper: "ＡＢＣＤＥＦＧＨＩＪＫＬＭＮＯＰＱＲＳＴＵＶＷＸＹＺ", digits: "０１２３４５６７８９" },
  { name: "Circled", lower: "ⓐⓑⓒⓓⓔⓕⓖⓗⓘⓙⓚⓛⓜⓝⓞⓟⓠⓡⓢⓣⓤⓥⓦⓧⓨⓩ", upper: "ⒶⒷⒸⒹⒺⒻⒼⒽⒾⒿⓀⓁⓂⓃⓄⓅⓆⓇⓈⓉⓊⓋⓌⓍⓎⓏ", digits: "⓪①②③④⑤⑥⑦⑧⑨" },
  { name: "Small Caps", lower: "ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘQʀꜱᴛᴜᴠᴡxʏᴢ", upper: "ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘQʀꜱᴛᴜᴠᴡxʏᴢ", digits: "" }
];

function buildMap(styleArr){
  const map = {};
  const lowerChars = Array.from(styleArr.lower);
  const upperChars = Array.from(styleArr.upper);
  const digitChars = Array.from(styleArr.digits);
  for(let i=0;i<26;i++){
    if(lowerChars[i]) map[LOWER[i]] = lowerChars[i];
    if(upperChars[i]) map[UPPER[i]] = upperChars[i];
  }
  for(let i=0;i<10;i++){
    if(digitChars[i]) map[DIGITS[i]] = digitChars[i];
  }
  return map;
}

const STYLE_MAPS = STYLES.map(s => ({ name: s.name, map: buildMap(s) }));

function convertWithMap(text, map){
  let out = "";
  for(const ch of text){
    out += map[ch] || ch;
  }
  return out;
}

function strikethrough(text){
  let out = "";
  for(const ch of text){ out += ch + "\u0336"; }
  return out;
}
function underline(text){
  let out = "";
  for(const ch of text){ out += ch + "\u0332"; }
  return out;
}

const FLIP_MAP = {
  a:"ɐ",b:"q",c:"ɔ",d:"p",e:"ǝ",f:"ɟ",g:"ƃ",h:"ɥ",i:"ᴉ",j:"ɾ",k:"ʞ",l:"l",m:"ɯ",n:"u",
  o:"o",p:"d",q:"b",r:"ɹ",s:"s",t:"ʇ",u:"n",v:"ʌ",w:"ʍ",x:"x",y:"ʎ",z:"z",
  "0":"0","1":"Ɩ","2":"ᄅ","3":"Ɛ","4":"ㄣ","5":"ϛ","6":"9","7":"ㄥ","8":"8","9":"6",
  " ":" ","!":"¡","?":"¿"
};
function upsideDown(text){
  const lower = text.toLowerCase();
  let out = "";
  for(const ch of lower){ out += FLIP_MAP[ch] !== undefined ? FLIP_MAP[ch] : ch; }
  return out.split("").reverse().join("");
}

function renderResults(){
  const raw = $('textInput').value;
  const box = $('results');
  box.innerHTML = "";

  if(!raw.trim()){
    box.innerHTML = '<div class="empty-state">Type something above to see fancy fonts.</div>';
    return;
  }

  const variants = [];
  STYLE_MAPS.forEach(s => variants.push({ name: s.name, text: convertWithMap(raw, s.map) }));
  variants.push({ name: "Strikethrough", text: strikethrough(raw) });
  variants.push({ name: "Underline", text: underline(raw) });
  variants.push({ name: "Upside Down", text: upsideDown(raw) });

  variants.forEach(v => {
    const row = document.createElement('div');
    row.className = 'style-row';
    row.innerHTML =
      '<div>' +
        '<div class="style-label">' + v.name + '</div>' +
        '<div class="style-text"></div>' +
      '</div>' +
      '<button class="copy-btn">Copy</button>';
    row.querySelector('.style-text').textContent = v.text;
    row.querySelector('.copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(v.text).then(() => {
        const btn = row.querySelector('.copy-btn');
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = original; }, 1200);
      });
    });
    box.appendChild(row);
  });
}

$('textInput').addEventListener('input', renderResults);
renderResults();
</script>
</body>
</html>
