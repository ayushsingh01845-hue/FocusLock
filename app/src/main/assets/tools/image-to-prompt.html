<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image to Prompt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0d12; --ink-3:#1a1f29; --pink:#ff3b3b; --cyan:#5eead4; --yellow:#ffd166; --purple:#b98dff;
    --text:#f5f6f8; --text-dim:#9aa1ad; --line:#1d222b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--ink); color:var(--text);
    font-family:'Work Sans',sans-serif; padding:20px 16px 60px;
  }
  .wrap{max-width:520px; margin:0 auto;}
  .back{
    display:inline-flex; align-items:center; gap:6px; color:var(--text-dim);
    text-decoration:none; font-size:14px; margin-bottom:18px;
  }
  h1{
    font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:26px;
    margin:0 0 6px;
  }
  .sub{color:var(--text-dim); font-size:14px; margin:0 0 22px; line-height:1.5;}
  .card{
    background:#10141b; border:1px solid var(--line); border-radius:16px;
    padding:20px; margin-bottom:16px;
  }
  .upload-zone{
    border:1.5px dashed var(--line); border-radius:14px; padding:30px 16px;
    text-align:center; cursor:pointer; margin-bottom:4px;
  }
  .upload-zone svg{width:28px; height:28px; color:var(--text-dim); margin-bottom:8px;}
  .upload-zone b{display:block; font-family:'Bricolage Grotesque',sans-serif; font-size:14px;}
  .upload-zone span{font-size:11.5px; color:var(--text-dim);}
  input[type=file]{display:none;}

  .preview-wrap{
    width:100%; border-radius:14px; overflow:hidden;
    border:1px solid var(--line); margin-bottom:16px; display:none;
    max-height:280px;
  }
  .preview-wrap img{display:block; width:100%; height:auto; object-fit:contain;}

  button{
    width:100%; border:none; border-radius:12px; padding:14px; font-size:15px;
    font-weight:600; font-family:'Work Sans',sans-serif; cursor:pointer;
  }
  .btn-primary{background:var(--pink); color:#fff;}
  .btn-primary:disabled{opacity:.4;}
  .status{font-size:13px; color:var(--text-dim); text-align:center; margin-top:12px; min-height:18px;}
  .status.err{color:var(--pink);}

  .result-card{
    display:none; background:var(--ink-3); border:1px solid var(--cyan); border-radius:16px;
    padding:20px; margin-top:6px;
  }
  .result-card.show{display:block;}
  .result-label{font-size:10.5px; color:var(--cyan); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:10px; font-family:'Space Mono',monospace;}
  .result-text{font-size:14.5px; line-height:1.6; white-space:pre-wrap; margin-bottom:14px;}
  .copy-btn{background:var(--pink); color:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; Back</a>
  <h1>Image to Prompt</h1>
  <p class="sub">Upload any image and get a detailed AI prompt that could recreate it — great for figuring out how an edit was made.</p>

  <div class="card">
    <div class="upload-zone" id="uploadZone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round"/></svg>
      <b>Tap to upload an image</b>
      <span>JPG or PNG, any photo or AI image</span>
    </div>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="preview-wrap" id="previewWrap">
    <img id="previewImg" src="" alt="">
  </div>

  <button class="btn-primary" id="generateBtn" disabled>Generate Prompt</button>
  <div class="status" id="statusEl"></div>

  <div class="result-card" id="resultCard">
    <div class="result-label">Master Prompt</div>
    <div class="result-text" id="resultText"></div>
    <button class="copy-btn" id="copyBtn">Copy Prompt</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const PROXY_BASE_URL = 'https://crimson-resonance-b977ayush-cricket-proxy.ayushjibabuaan07.workers.dev/';

let imageBase64 = null;
let imageMime = null;

$('uploadZone').addEventListener('click', () => $('fileInput').click());

$('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  imageMime = file.type || 'image/jpeg';

  const reader = new FileReader();
  reader.onload = (ev) => {
    const dataUrl = ev.target.result;
    imageBase64 = dataUrl.split(',')[1];
    $('previewImg').src = dataUrl;
    $('previewWrap').style.display = 'block';
    $('generateBtn').disabled = false;
    $('resultCard').classList.remove('show');
    $('statusEl').textContent = '';
  };
  reader.readAsDataURL(file);
});

$('generateBtn').addEventListener('click', async () => {
  if (!imageBase64) return;
  const statusEl = $('statusEl');
  $('generateBtn').disabled = true;
  statusEl.textContent = 'Looking at your image...';
  statusEl.className = 'status';

  try {
    const resp = await fetch(PROXY_BASE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'describeImage',
        image: imageBase64,
        mimeType: imageMime
      })
    });
    const data = await resp.json();

    if (data.error) {
      statusEl.textContent = 'Error: ' + data.error;
      statusEl.className = 'status err';
      return;
    }

    statusEl.textContent = '';
    $('resultText').textContent = data.prompt;
    $('resultCard').classList.add('show');
    $('resultCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
  } catch (err) {
    statusEl.textContent = "Couldn't reach the server. Try again.";
    statusEl.className = 'status err';
  } finally {
    $('generateBtn').disabled = false;
  }
});

$('copyBtn').addEventListener('click', () => {
  const text = $('resultText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = $('copyBtn');
    const original = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
});
</script>
</body>
</html>
