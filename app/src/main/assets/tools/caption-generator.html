<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Caption Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0d12;--ink-3:#1a1f29;--pink:#ff3b3b;--cyan:#5eead4;--yellow:#ffd166;--purple:#b98dff;--text:#f5f6f8;--text-dim:#9aa1ad;--line:#1d222b;}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;background:var(--ink);color:var(--text);font-family:"Work Sans",sans-serif;padding:20px 16px 60px;}
.wrap{max-width:560px;margin:0 auto;}
.back{display:inline-flex;color:var(--text-dim);text-decoration:none;font-size:14px;margin-bottom:18px;}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;margin:0 0 6px;}
.sub{color:var(--text-dim);font-size:14px;margin:0 0 22px;line-height:1.5;}
.card{background:#10141b;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;}
button{border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:600;font-family:"Work Sans",sans-serif;cursor:pointer;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.tab{background:#10141b;border:1px solid var(--line);color:var(--text-dim);padding:9px 14px;font-size:13px;border-radius:999px;}
.tab.active{background:var(--pink);color:#fff;border-color:var(--pink);}
.go{width:100%;background:var(--pink);color:#fff;margin-bottom:16px;}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink-3);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.opt-text{font-size:14px;line-height:1.5;flex:1;}
.cp{background:none;border:1px solid var(--line);color:var(--cyan);padding:7px 11px;font-size:12px;border-radius:8px;}
.label{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px;font-family:"Space Mono",monospace;}
</style></head><body><div class="wrap">
<a class="back" href="index.html">&larr; Back</a>
<h1>Caption & Hashtag Generator</h1>
<p class="sub">Pick a vibe, get options, copy and post.</p>
<div class="tabs" id="tabs">
<button class="tab active" data-v="aesthetic">Aesthetic</button>
<button class="tab" data-v="glowup">Glow Up</button>
<button class="tab" data-v="funny">Funny</button>
<button class="tab" data-v="motivational">Motivational</button>
</div>
<button class="go" id="go">✦ Generate</button>
<div id="out" style="display:none;">
<div class="label">Pick a caption</div><div id="caps"></div>
<div class="label">Hashtags</div>
<div class="opt"><div class="opt-text" id="tags"></div><button class="cp" id="cpTags">Copy</button></div>
</div>
</div>
<script>
const CAP={
aesthetic:["soft light, softer moments ✨","some days just look like this 🌙","living in my own color palette","quiet moments, loud energy","golden hour, gentler heart","not posing, just existing beautifully"],
glowup:["growth looks good on me 🌱","not the same person I was last year","leveling up, one day at a time","new season, new me","healing loud, glowing louder","the upgrade nobody saw coming"],
funny:["send help, I'm out of captions 😅","professional overthinker on a break","main character energy, side character budget","not photogenic, just persistent","camera loves me, my wifi doesn't","chaotic but make it cute"],
motivational:["small steps still count","discipline over motivation, every time","still showing up, still going","future me is already proud","consistency is the whole flex","bet on yourself and don't fold"]};
const TAG={
aesthetic:["#aesthetic","#moodygrams","#softlife","#visualsoflife","#dailyaesthetic","#aestheticfeed","#moodyedits","#pictureoftheday"],
glowup:["#glowup","#selfimprovement","#growthmindset","#newme","#levelup","#glowupchallenge","#selfgrowth","#bettereveryday"],
funny:["#relatable","#funnyvibes","#mood","#lol","#justforfun","#funnymemes","#comedy","#dailyhumor"],
motivational:["#motivation","#discipline","#mindset","#keepgoing","#dailygrind","#hustle","#successmindset","#nevergiveup"]};
let vibe='aesthetic';
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const copy=t=>navigator.clipboard.writeText(t);
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');vibe=b.dataset.v;});
document.getElementById('go').onclick=()=>{
  const caps=document.getElementById('caps');caps.innerHTML='';
  shuf(CAP[vibe]).slice(0,3).forEach(c=>{
    const r=document.createElement('div');r.className='opt';
    const t=document.createElement('div');t.className='opt-text';t.textContent=c;
    const b=document.createElement('button');b.className='cp';b.textContent='Copy';
    b.onclick=()=>{copy(c);b.textContent='Copied!';setTimeout(()=>b.textContent='Copy',1200);};
    r.appendChild(t);r.appendChild(b);caps.appendChild(r);
  });
  document.getElementById('tags').textContent=shuf(TAG[vibe]).slice(0,6).join(' ');
  document.getElementById('out').style.display='block';
};
document.getElementById('cpTags').onclick=function(){copy(document.getElementById('tags').textContent);this.textContent='Copied!';setTimeout(()=>this.textContent='Copy',1200);};
</script></body></html>
