<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Downloads</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0d12;--ink-3:#1a1f29;--pink:#ff3b3b;--cyan:#5eead4;--yellow:#ffd166;--purple:#b98dff;--text:#f5f6f8;--text-dim:#9aa1ad;--line:#1d222b;}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;background:var(--ink);color:var(--text);font-family:"Work Sans",sans-serif;padding:20px 16px 60px;}
.wrap{max-width:560px;margin:0 auto;}
.back{display:inline-flex;color:var(--text-dim);text-decoration:none;font-size:14px;margin-bottom:18px;}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;margin:0 0 6px;}
.sub{color:var(--text-dim);font-size:14px;margin:0 0 22px;line-height:1.5;}
.card{background:#10141b;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;}
button{border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:600;font-family:"Work Sans",sans-serif;cursor:pointer;}
.dl{position:relative;overflow:hidden;}
.dl::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pink),var(--yellow),var(--cyan),var(--purple));}
.dt{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14.5px;margin-bottom:10px;}
.media{width:100%;border-radius:12px;display:block;margin-bottom:10px;border:1px solid var(--line);}
.btn{display:flex;justify-content:center;padding:12px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#0b0b14;text-decoration:none;font-weight:700;font-size:13px;}
.time{margin-top:10px;font-size:11px;color:var(--text-dim);font-family:"Space Mono",monospace;}
.empty{color:var(--text-dim);font-size:13px;text-align:center;padding:24px;}
</style></head><body><div class="wrap">
<a class="back" href="index.html">&larr; Back</a>
<h1>Downloads</h1>
<p class="sub">Photos, videos and files, ready to save.</p>
<div id="list"><div class="empty">Loading...</div></div>
</div>
<script>
const CSV_URL='https://docs.google.com/spreadsheets/d/1gU5u7UZ2YQ8icfpFC_sHGD4L9YLpaO5jkSAy_e2hiIk/export?format=csv&gid=0';
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++;}else q=false;}else f+=c;}else{if(c=='"')q=true;else if(c==','){row.push(f);f='';}else if(c=='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c=='\r'){}else f+=c;}}if(f.length||row.length){row.push(f);rows.push(row);}return rows;}
function forceDl(u){if(u.indexOf('res.cloudinary.com')===-1)return u;if(u.indexOf('fl_attachment')!==-1)return u;return u.replace('/upload/','/upload/fl_attachment/');}
(async()=>{
  const list=document.getElementById('list');
  try{
    const res=await fetch(CSV_URL+'&_='+Date.now());
    const rows=parseCSV(await res.text());
    const h=rows[0].map(x=>x.trim().toLowerCase());
    const ti=h.indexOf('title'),ty=h.indexOf('type'),ur=h.indexOf('url'),tm=h.indexOf('timestamp');
    const items=rows.slice(1).filter(r=>r.some(c=>c.trim())).map(r=>({title:(r[ti]||'').trim(),type:(r[ty]||'link').trim().toLowerCase(),url:(r[ur]||'').trim(),time:(r[tm]||'').trim()})).filter(d=>d.url).reverse();
    if(!items.length){list.innerHTML='<div class="card"><div class="empty">Nothing here yet.</div></div>';return;}
    list.innerHTML='';
    items.forEach(d=>{
      const c=document.createElement('div');c.className='card dl';
      if(d.title){const t=document.createElement('div');t.className='dt';t.textContent=d.title;c.appendChild(t);}
      if(d.type==='video'){const v=document.createElement('video');v.src=d.url;v.controls=true;v.className='media';c.appendChild(v);}
      else if(d.type==='photo'){const i=document.createElement('img');i.src=d.url;i.className='media';i.alt=d.title||'photo';c.appendChild(i);}
      const a=document.createElement('a');a.className='btn';a.rel='noopener noreferrer';
      if(d.type==='link'){a.href=d.url;a.target='_blank';a.textContent='→ Open link';}
      else{a.href=forceDl(d.url);a.setAttribute('download','');a.textContent='↓ Download '+(d.type==='file'?'file':d.type);}
      c.appendChild(a);
      if(d.time){const t=document.createElement('div');t.className='time';t.textContent=d.time;c.appendChild(t);}
      list.appendChild(c);
    });
  }catch(e){list.innerHTML='<div class="card"><div class="empty">Could not load downloads.</div></div>';}
})();
</script></body></html>
